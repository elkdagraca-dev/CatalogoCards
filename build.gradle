plugins {
    id 'com.android.library' version '8.6.1'
}

android {
    namespace 'com.plotpoint.cards'

    compileSdk 35

    defaultConfig {
        minSdk 21
        targetSdk 35
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_8
        targetCompatibility JavaVersion.VERSION_8
    }
}
